
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Stockage image n°1 — Biblio&ESM</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap');

    :root {
      --ink: #29251f;
      --muted: #756f66;
      --cream: #f7f3ed;
      --white: #fffdf9;
      --brown: #5b4636;
      --brown-dark: #403127;
      --orange: #c66a3d;
      --line: #e5ddd2;
      --shadow: 0 12px 35px rgba(55, 43, 31, .08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: "DM Sans", sans-serif;
      color: var(--ink);
      background: var(--cream);
    }

    /* HEADER */

    .topbar {
      width: 100%;
      padding: 18px 6%;
      background: rgba(255, 253, 249, .96);
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--brown-dark);
      font-family: "Outfit", sans-serif;
      font-size: 20px;
      font-weight: 700;
    }

    .logo {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: var(--brown);
      color: var(--cream);
      font-family: "Outfit", sans-serif;
      font-size: 18px;
      font-weight: 700;
    }

    /* CONTENU */

    main {
      flex: 1;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 70px 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .storage-card {
      width: 100%;
      max-width: 720px;
      padding: 50px 35px;
      text-align: center;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 14px;
      color: var(--orange);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      color: var(--brown-dark);
      font-family: "Outfit", sans-serif;
      font-size: clamp(30px, 5vw, 46px);
      line-height: 1.1;
      font-weight: 700;
    }

    .line {
      width: 55px;
      height: 4px;
      margin: 22px auto 0;
      border-radius: 999px;
      background: var(--orange);
    }

    /* FOOTER */

    footer {
      padding: 25px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    /* MOBILE */

    @media (max-width: 600px) {

      .topbar {
        padding: 15px 20px;
      }

      .brand {
        font-size: 18px;
      }

      .logo {
        width: 38px;
        height: 38px;
      }

      main {
        padding: 45px 15px;
      }

      .storage-card {
        padding: 42px 22px;
        border-radius: 20px;
      }

      h1 {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <div class="brand">
      <div class="logo">B&</div>
      <span>Biblio&ESM</span>
    </div>
  </header>

  <main>
    <section class="storage-card">
      <span class="eyebrow">Stockage</span>

      <h1>Stockage image n°1</h1>

      <div class="line"></div>
    </section>
  </main>

  <footer>
    Biblio&ESM · Lire. Écouter. Découvrir.
  </footer>

</body>
</html>
